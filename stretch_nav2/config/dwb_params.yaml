controller_server:
  ros__parameters:
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.26 # -0.05
      min_vel_y: -0.26 # 0
      # min_vel_y: 0.0
      max_vel_x: 0.26
      # max_vel_y: 0.0
      max_vel_y: 0.26 #0.0
      max_vel_theta: 1.0
      min_speed_xy: -0.26 #0.0
      max_speed_xy: 0.26
      min_speed_theta: -1.0 #0.0
      acc_lim_x: 2.5
      # acc_lim_y: 0.0
      acc_lim_y: 2.5 #0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: -2.5 #0.0
      # decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      # vy_samples: 5
      vy_samples: 20 #5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      PreferForward.penalty: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.4

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.22
      inflation_layer:
        inflation_radius: 0.4
