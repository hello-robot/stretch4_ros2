/**:
  ros__parameters:
    filter_attachment: true
    attachment_frame: quick_connect_interface_link
    # Box center offset in quick_connect frame. origin_y = -half_y anchors y=0 at the
    # quick-connect face and extends the tool volume in -Y (toward grasp_center ~ -0.23 m).
    attachment_box_origin_x: 0.0
    attachment_box_origin_y: -0.12
    attachment_box_origin_z: 0.0
    attachment_half_extents_x: 0.13 #0.12
    attachment_half_extents_y: 0.13 #0.12
    attachment_half_extents_z: 0.06 #0.05
    attachment_buffer: 0.04 #0.05

