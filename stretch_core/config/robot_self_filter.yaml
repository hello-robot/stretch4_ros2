# Shared self-filter policy.
# Detailed arm/wrist/tool boxes are generated from URDF collision geometry at launch time.
/**:
  ros__parameters:
    frame_id: base_footprint
    self_filter_tf_timeout_sec: 0.05

    # Near-field ROI: full robot self-filter geometry only runs inside this XY cylinder.
    self_filter_spatial_gate_enabled: true
    self_filter_gate_radius_m: 1.5
    self_filter_gate_z_min_m: -0.05
    self_filter_gate_z_max_m: 1.6

    # Base: infinite vertical cylinder in XY. Always active when self-filter runs.
    base_radius: 0.25

    # Arm capsule: cheap continuous cover for the telescoping arm.
    # It is always active when the self-filter stage is enabled.
    # URDF-derived arm/lift boxes add local details such as the shoulder wire-cover hump.
    arm_line_start_frame: arm_l0_link
    arm_line_start_height_frame: lift_link
    arm_line_height_offset_z: 0.04
    arm_line_end_frame: wrist_link
    arm_filter_radius: 0.07
    arm_filter_radius_buffer: 0.04

    # Marker controls for URDF-derived boxes. Broad-phase spheres remain internal only.
    publish_raw_urdf_self_filter_markers: false
    publish_buffered_self_filter_markers: true
