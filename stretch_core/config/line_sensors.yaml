line_sensor_publisher:
  ros__parameters:
    # Output frame and timing.
    base_frame: base_link
    publish_rate_hz: 30.0
    stale_timeout_s: 0.5
    use_tare: true
    publish_debug: false
    publish_raw_scans: false
    raw_scan_topic_prefix: /line_sensor_raw

    # Published topics — hazard outputs.
    points_topic: /line_sensor/points
    obstacle_topic: /line_sensor/obstacle_points
    small_drop_topic: /line_sensor/small_drop_points
    probable_cliff_topic: /line_sensor/probable_cliff_points
    deep_drop_topic: /line_sensor/deep_drop_points
    degraded_topic: /line_sensor/degraded_points

    # Published topics — debug (only created when publish_debug is true).
    counts_topic: /line_sensor/debug/source_counts
    raw_obstacle_topic: /line_sensor/debug/raw_obstacle_points
    spatial_obstacle_topic: /line_sensor/debug/spatial_obstacle_points
    raw_small_drop_topic: /line_sensor/debug/raw_small_drop_points
    spatial_small_drop_topic: /line_sensor/debug/spatial_small_drop_points
    spray_topic: /line_sensor/debug/spray_points
    benign_null_topic: /line_sensor/debug/benign_null_points
    raw_marginal_obstacle_topic: /line_sensor/debug/raw_marginal_obstacle_points

    # Visualization heights for filtered hazard outputs.
    obstacle_z: 0.02
    small_drop_z: -0.05
    degraded_z: 0.0

    # Filter tunables: defaults live in LineSensorConfig
    # (stretch_core/line_sensor_filter/config.py). Naming a field here
    # overrides it.
    cliff_min_drop_m: 0.015
