bt_navigator:
  ros__parameters:
    default_nav_to_pose_bt_xml: $(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      # critics: [
      #   "ConstraintCritic", "CostCritic", "GoalCritic",
      #   "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
      #   "PathAngleCritic", "PreferForwardCritic"]
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
         "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.28 # 0.22
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.4

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.28 # 0.22
      inflation_layer:
        inflation_radius: 0.4
