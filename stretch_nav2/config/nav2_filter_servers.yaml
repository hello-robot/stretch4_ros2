# Costmap filter mask servers + info servers for keepout (type 0) and speed (type 1).
# yaml_filename for masks is injected at launch via RewrittenYaml / extra parameters.

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: /keepout_filter_mask
    # yaml_filename set at launch

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: /keepout_costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    frame_id: map
    topic_name: /speed_filter_mask
    # yaml_filename set at launch

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 1
    filter_info_topic: /speed_costmap_filter_info
    mask_topic: /speed_filter_mask
    # speed = base + multiplier * OccupancyGrid_value
    base: 0.0
    multiplier: 0.05
